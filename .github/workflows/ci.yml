name: CI
on:
  pull_request:
  push:
    branches: [main, "feature/**"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: integrity
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U integrity"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://integrity:test@127.0.0.1:5432/test
      DATABASE_URL: postgresql://integrity:test@127.0.0.1:5432/integrity
      INTEGRITY_REVIEWERS: '{"ci-reviewer":"fixture-ci-only-3b98478bf5d452f9"}'
      E2E_REVIEWER_TOKEN: fixture-ci-only-3b98478bf5d452f9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-dev.txt "pandas>=2.2,<3"
      - run: python -c "import os, psycopg; db=psycopg.connect(os.environ['DATABASE_URL'], autocommit=True); db.execute('CREATE DATABASE test'); db.close()"
      - run: python -m pytest -q
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser integration test
        run: |
          python -m integrity migrate
          python -m integrity analyze > /tmp/signal-analyzer.log 2>&1 &
          uvicorn integrity.api:app > /tmp/signal-api.log 2>&1 &
          (cd web && npm run dev -- --host 127.0.0.1) > /tmp/signal-web.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/api/health; then break; fi
            sleep 1
          done
          cd web
          npm test
      - name: Verify Compose startup
        run: |
          docker compose --profile live config --quiet
          docker compose up --build -d --wait --wait-timeout 90
          curl -fsS http://127.0.0.1:8080/api/health
          cd web
          E2E_URL=http://127.0.0.1:8080 npm test
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose
        if: always()
        run: docker compose down --volumes
